<!doctype html>
<html lang="es" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Election Desk 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&family=Oswald:wght@400;500;600;700&family=Roboto+Condensed:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&display=block">
<!--
US midterms 2026 election-night desk: the page the encoder streams for /s/election-es|ja|zh/ (docs/ELECTION.md, "Page contract").
  ?lang=es|ja|zh        stream language (UI strings in html/election/desk.js; snapshots arrive localised)
  ?autoplay=1           start the narration without a click (encoder)
  ?demo=1               play html/election/sample/manifest_<lang>.json + desk_<lang>.json (falls back to mock_*.json); ?demo=mock forces the mock
  ?still=TX&visual=st_counties&focus=48201   one frozen visual for screenshots (still=national for nat_*); &call=1 injects a test call
  ?scene=N              demo: start at playlist index N        ?now=ISO   demo: pin the clock
Data: live/current.json (manifest, 204 while none, polled 5 s), live/<package_id>/<wav>, live/desk.json (chrome, polled 30 s),
POST live/playback heartbeat. Maps: html/election/geo/. Rules: research/election/legal.md (no calls of our own, no check marks,
no photos, disclosure always on screen, "Unofficial results" label on every count).
-->
<style>
:root{
  --dem-900:#08256E; --dem-700:#0B5AA6; --dem-500:#1F6FD1; --dem-300:#2BA5E5; --dem-hi:#1E8FE1;
  --rep-900:#680001; --rep-700:#AD0004; --rep-500:#CC142E; --rep-300:#F07E86; --rep-hi:#D81E2C;
  --ind-900:#2E3139; --ind-700:#5B5F6B; --ind-500:#7A7F8C; --ind-300:#A9AEB9; --ind-hi:#6A6F7C;
  --navy-950:#0E1124; --navy-900:#1B1948; --navy-800:#232657; --navy-700:#2E3270;
  --plate:#FEFCFC; --strip:#E4E4E4; --ink:#111111; --ink-2:#4A4A4A; --mute:#8C8C8C;
  --alert:#A00008; --tab:#D30E23; --live:#D30E23; --cd:#1446C4;
  --yellow:#F1DD20; --gold:#E2B227; --meter:#4B9136; --meter-off:#2A2F45;
  --map-norace:#2B3247; --map-line:#0E1222; --map-nodata:#8A8F9C;
  --e-out:cubic-bezier(.16,1,.3,1); --e-in:cubic-bezier(.7,0,.84,0); --e-io:cubic-bezier(.65,0,.35,1);
  --cjk:"Noto Sans JP";
  --f-cond:"Oswald",var(--cjk),sans-serif; --f-num:"Roboto Condensed",var(--cjk),sans-serif; --f-sans:"Figtree",var(--cjk),sans-serif;
  --bar-top:872px;
}
.lang-zh{--cjk:"Noto Sans SC"}
.lang-ja,.lang-zh{--bar-top:846px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:var(--f-sans);color:#fff;-webkit-font-smoothing:antialiased;font-kerning:normal}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;transform-origin:50% 50%;background:var(--navy-950)}
.num,.tn{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.instant *,.instant *::before,.instant *::after{transition:none!important;animation:none!important}

/* ---------- background (static: painted once) ---------- */
#bg{position:absolute;inset:0;background:
  radial-gradient(ellipse 1300px 700px at 62% 38%,rgba(53,63,140,.55),rgba(53,63,140,0) 70%),
  linear-gradient(180deg,#151a44 0%,#0f1331 55%,#0b0e24 100%)}
#bg::after{content:"";position:absolute;inset:0;opacity:.5;background:repeating-linear-gradient(115deg,rgba(255,255,255,.018) 0 2px,transparent 2px 46px)}

/* ---------- scene area ---------- */
#scene{position:absolute;left:0;top:0;width:1920px;height:840px;overflow:hidden}
.scn{position:absolute;inset:0}
.vis{position:absolute;inset:0;opacity:0;visibility:hidden}
.vis.on{opacity:1;visibility:visible}
.vis.on.off{opacity:0;transition:opacity 220ms linear}
.bi{opacity:0;transform:translateY(26px)}
.on .bi{opacity:1;transform:none;transition:opacity 260ms var(--e-out) var(--d,0ms),transform 420ms var(--e-out) var(--d,0ms)}
.bl{opacity:0;transform:translateX(-40px)}
.on .bl{opacity:1;transform:none;transition:opacity 250ms var(--e-out) var(--d,0ms),transform 400ms var(--e-out) var(--d,0ms)}
.wipe{clip-path:inset(0 100% 0 0)}
.on .wipe{clip-path:inset(0 0 0 0);transition:clip-path 540ms var(--e-out) var(--d,400ms)}
.rise{transform:scaleY(0);transform-origin:50% 100%}
.on .rise{transform:none;transition:transform 220ms var(--e-out) var(--d,534ms)}
.fadein{opacity:0}
.on .fadein{opacity:1;transition:opacity 300ms linear var(--d,800ms)}
.fit{display:inline-block;white-space:nowrap;transform-origin:0 50%}
.fitbox{overflow:visible;white-space:nowrap;min-width:0}

/* party tokens */
.p-DEM{--p9:var(--dem-900);--p7:var(--dem-700);--p5:var(--dem-500);--p3:var(--dem-300);--phi:var(--dem-hi)}
.p-REP{--p9:var(--rep-900);--p7:var(--rep-700);--p5:var(--rep-500);--p3:var(--rep-300);--phi:var(--rep-hi)}
.p-IND,.p-LIB,.p-GRN,.p-OTH{--p9:var(--ind-900);--p7:var(--ind-700);--p5:var(--ind-500);--p3:var(--ind-300);--phi:var(--ind-hi)}

/* monogram chip (stands in for the headshot square; no photos, rule 14/15) */
.mono{position:relative;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden;
  background:linear-gradient(155deg,var(--p5) 0%,var(--p7) 55%,var(--p9) 100%);font-family:var(--f-cond);font-weight:600;letter-spacing:.02em}
.mono::before{content:"";position:absolute;width:74%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.28)}
.mono .ini{position:relative;line-height:1}
.mono .pl{position:absolute;right:0;bottom:0;background:var(--p9);color:#fff;font-family:var(--f-num);font-weight:800;display:flex;align-items:center;justify-content:center}
.mono .inc{position:absolute;left:0;bottom:0;background:rgba(0,0,0,.55);font:700 13px/1 var(--f-num);letter-spacing:.04em;padding:4px 5px;text-transform:uppercase}

/* ---------- CNN-style wall title plate ---------- */
.wt{position:absolute;left:80px;top:62px;z-index:5}
.wt .t{position:relative;display:inline-block;background:rgba(21,20,62,.95);padding:2px 30px 12px 24px;font:800 84px/1.08 var(--f-sans);white-space:nowrap;letter-spacing:-.01em}
.wt .t::before{content:"";position:absolute;left:0;right:0;top:-7px;height:7px;background:linear-gradient(90deg,var(--tab) 0%,var(--tab) 75%,rgba(211,14,35,.25) 100%)}
.wt .t i{font-style:normal;font-weight:300;margin-left:.22em}
.wt .s{display:inline-block;background:rgba(21,20,62,.95);padding:2px 26px 10px 24px;font:400 46px/1.12 var(--f-sans);white-space:nowrap}
.lang-ja .wt .t,.lang-zh .wt .t{font-weight:900;font-size:76px;line-height:1.18}
.lang-ja .wt .s,.lang-zh .wt .s{font-size:40px;font-weight:500}

/* wall rows (CNN wall board: chip | navy name block | party stat block) */
.wrows{position:absolute;left:80px;z-index:5}
.wrow{display:flex;height:118px;margin-bottom:14px}
.wrow .mono{width:100px;height:118px;font-size:46px}
.wrow .mono .pl{width:30px;height:30px;font-size:22px}
.wrow .nm{width:286px;background:rgba(21,20,62,.96);display:flex;flex-direction:column;justify-content:center;padding:0 18px;overflow:hidden}
.wrow .nm .f{font:400 27px/1.15 var(--f-sans);white-space:nowrap}
.wrow .nm .f:has(> .fit:empty){display:none}
.wrow .nm .l{font:800 46px/1.06 var(--f-sans);white-space:nowrap}
.lang-ja .wrow .nm .l,.lang-zh .wrow .nm .l{font-weight:900;font-size:42px}
.wrow .st{width:206px;background:var(--phi);display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding:4px 16px 6px}
.wrow .st .v{font:600 28px/1 var(--f-num);font-variant-numeric:tabular-nums;opacity:.96}
.wrow .st .p{font:800 70px/1 var(--f-sans);font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:4px}
.wrow .st .p sup,.brow .pct sup,.sup{font-size:.42em;vertical-align:top;position:relative;top:.16em;margin-left:.04em;font-weight:700}
.wrow .st.none{background:rgba(70,76,96,.9)}
.wrow .st .msg{font:600 22px/1.15 var(--f-num);text-align:right;text-transform:uppercase;color:#e6e8ee}
.wnote{display:inline-block;background:rgba(21,20,62,.94);padding:8px 18px;font:400 26px/1.25 var(--f-sans);color:#e9ebf2;margin-top:2px;white-space:nowrap}
.wnote b{font-weight:800;color:#fff}
.srcline{font:500 21px/1.3 var(--f-sans);color:#C9CCD6;white-space:nowrap}
.srcline b{font-weight:700;color:#fff}

/* ---------- results board (CNN 2024/2025 board, neutral grey base) ---------- */
.board{position:absolute;left:200px;width:1520px;background:linear-gradient(180deg,#5c5f68 0%,#484b54 100%);box-shadow:0 18px 50px rgba(0,0,0,.45)}
.vis .board{opacity:0;transform:scale(.97)}
.vis.on .board{opacity:1;transform:none;transition:opacity 200ms linear,transform 400ms var(--e-out)}
.board .hd{display:flex;height:150px;background:#fff;color:#111}
.board .hd .tab{width:150px;flex:none;background:var(--tab);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-cond)}
.board .hd .tab b{font-weight:700;font-size:74px;line-height:.95}
.board .hd .tab span{font-weight:500;font-size:26px;letter-spacing:.06em}
.board .hd .nm{flex:1;min-width:0;display:flex;align-items:center;padding:0 28px;font:700 118px/1 var(--f-cond);text-transform:uppercase;letter-spacing:-.005em}
.lang-ja .board .hd .nm,.lang-zh .board .hd .nm{font-weight:900;font-size:100px}
.board .hd .seat{flex:none;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding:0 34px 0 10px;font-family:var(--f-cond);text-align:right}
.board .hd .seat .c{font:500 26px/1.1 var(--f-cond);text-transform:uppercase;color:#444}
.board .hd .seat .v{font:700 56px/1.05 var(--f-cond);text-transform:uppercase}
.board .body{padding:16px 40px 22px}
.board .tag{display:inline-block;background:#fff;color:#111;font:600 36px/1.15 var(--f-cond);padding:0 14px;text-transform:uppercase}
.board .tag.sp{background:var(--yellow);margin-left:10px}
.brows{margin-top:12px}
.brow{display:flex;height:108px;margin-bottom:12px}
.brow .mono{width:108px;height:108px;font-size:46px}
.brow .mono .pl{width:28px;height:28px;font-size:20px}
.brow .plate{flex:1;min-width:0;background:linear-gradient(180deg,#ffffff,#eceef1);color:#111;display:flex;align-items:center;padding:0 22px 0 18px}
.brow .names{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;font-family:var(--f-cond);text-transform:uppercase}
.brow .names .f{font:500 38px/1 var(--f-cond);white-space:nowrap;display:flex;align-items:center;gap:12px}
.brow .names .f .itag{font:500 20px/1 var(--f-cond);background:#5B5F6B;color:#fff;padding:4px 7px 5px}
.brow .names .l{font:700 60px/.98 var(--f-cond);white-space:nowrap}
.lang-ja .brow .names .l,.lang-zh .brow .names .l{font-weight:900;font-size:54px;line-height:1.08}
.lang-ja .brow .names .f,.lang-zh .brow .names .f{font-weight:500;font-size:30px}
.brow .num{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding-left:14px}
.brow .ahead{font:600 30px/1 var(--f-num);color:#8C8C8C;text-transform:uppercase;white-space:nowrap}
.brow .votes{font:700 66px/1 var(--f-num);font-variant-numeric:tabular-nums}
.brow .pct{flex:none;width:400px;background:var(--phi);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:38px;font:800 104px/1 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.brow .pct.none{background:#6E727C}
.brow .rdim{position:absolute;inset:0;background:rgba(20,22,30,.55);opacity:0;transition:opacity 300ms linear;pointer-events:none}
.brows.hasfocus .brow:not(.focus) .rdim{opacity:1}
.board .msg{margin-top:4px;font:600 44px/1.15 var(--f-cond);text-transform:uppercase;color:#fff}
.board .rcv,.board .call{margin-top:10px;font:500 25px/1.3 var(--f-sans);color:#eef0f5;background:rgba(0,0,0,.22);padding:10px 16px;border-left:6px solid var(--yellow)}
.board .call{border-left-color:#fff}
.board .call b{font-weight:800}
.board .ft{display:flex;align-items:flex-end;justify-content:space-between;margin-top:18px;gap:30px}
.board .ft .src{font:500 22px/1.35 var(--f-sans);color:#D5D8DF}
.board .ft .src b{color:#fff;font-weight:700}
.meter{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.meter .row{display:flex;align-items:center;gap:10px}
.meter .val{font:800 34px/1 var(--f-num);color:#fff;font-variant-numeric:tabular-nums}
.meter .val small{font-size:.55em}
.meter .segs{display:flex;gap:3px;padding:3px;background:rgba(0,0,0,.35)}
.meter .segs i{width:22px;height:22px;background:var(--meter-off)}
.meter .segs i.lit{background:var(--meter)}
.meter .cap{font:700 14px/1.2 var(--f-num);letter-spacing:.06em;text-transform:uppercase;color:#d9dce4;margin-top:5px}

/* ---------- maps ---------- */
.mapwrap{position:absolute;left:0;top:0;width:1920px;height:840px;transform-origin:0 0}
.mapwrap.anim{will-change:transform}
.mapwrap svg{position:absolute;left:0;top:0;overflow:visible}
.mapwrap .dim{position:absolute;left:-4000px;top:-4000px;width:12000px;height:12000px;background:#05070f;opacity:0;transition:opacity 300ms linear;pointer-events:none}
.mapwrap.focused .dim{opacity:.34}
.nb path{fill:var(--map-norace);stroke:#46516d;stroke-width:calc(1px / var(--k,1))}
.mapwrap .natp{stroke-width:calc(1.3px / var(--k,1))}
.mapwrap .natf{stroke-width:calc(3.4px / var(--k,1))}
.cdot{position:absolute;z-index:8;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #000;opacity:0}
.cdot.on{opacity:1;transition:opacity 200ms linear}
.units path{stroke:rgba(10,14,30,.55);stroke-width:calc(.8px / var(--k,1));stroke-linejoin:round}
.souter{fill:none;stroke:#fff;stroke-width:calc(3.2px / var(--k,1));stroke-linejoin:round}
.souter2{fill:none;stroke:#000;stroke-width:calc(1.2px / var(--k,1));stroke-linejoin:round}
.focusp{stroke:#fff;stroke-linejoin:round;paint-order:stroke}
.callout{position:absolute;z-index:8;min-width:380px;background:rgba(21,20,62,.97);border-top:5px solid var(--tab);padding:12px 18px 14px;transform-origin:0 0;
  opacity:0;transform:scale(.92);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.callout.on{opacity:1;transform:none;transition:opacity 200ms var(--e-out),transform 200ms var(--e-out)}
.callout .h{font:800 34px/1.1 var(--f-sans);white-space:nowrap}
.callout .h i{font-style:normal;font-weight:300}
.callout .r{display:flex;align-items:center;gap:10px;margin-top:8px;height:40px}
.callout .r .ch{width:40px;height:40px;background:var(--p7);display:flex;align-items:center;justify-content:center;font:800 24px var(--f-num)}
.callout .r .n{flex:1;font:700 30px/1 var(--f-cond);text-transform:uppercase;white-space:nowrap}
.callout .r .v{font:600 24px/1 var(--f-num);color:#cfd3dd;font-variant-numeric:tabular-nums;white-space:nowrap}
.callout .r .p{min-width:112px;height:40px;background:var(--phi);text-align:right;padding:0 10px;font:800 32px/40px var(--f-num);font-variant-numeric:tabular-nums}
.callout .x{font:500 22px/1.3 var(--f-sans);color:#d9dce6;margin-top:9px;white-space:nowrap}
.callout .x b{color:#fff;font-weight:800}
.leader{position:absolute;z-index:7;height:2px;background:#fff;transform-origin:0 50%;opacity:0}
.leader.on{opacity:1;transition:opacity 200ms linear}
.mlabel{font:600 24px var(--f-cond);paint-order:stroke;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.legend{position:absolute;z-index:5;display:flex;flex-direction:column;gap:7px;font:500 22px/1.2 var(--f-sans);color:#e7e9f0}
.legend .li{display:flex;align-items:center;gap:12px;white-space:nowrap}
.legend .sw{width:28px;height:22px;flex:none;border:1px solid rgba(255,255,255,.35)}
.legend .ramp{display:flex;gap:2px}
.legend .ramp i{width:30px;height:18px}
.legend .lh{font:600 20px/1 var(--f-num);letter-spacing:.06em;text-transform:uppercase;color:#aeb4c4;margin-top:6px}
.inset{position:absolute;z-index:4;background:rgba(10,13,32,.92);border:2px solid #9aa3b8}
.inset .it{position:absolute;left:0;top:0;background:#9aa3b8;color:#0e1124;font:700 18px/1 var(--f-num);letter-spacing:.08em;padding:5px 10px;text-transform:uppercase}

/* ---------- Fox-style title plate + cards ---------- */
.fxt{position:absolute;left:0;right:0;top:34px;height:106px;background:linear-gradient(180deg,#ffffff 0%,#eef0f4 60%,#d9dde5 100%);display:flex;align-items:center;justify-content:center;
  font:700 76px/1 var(--f-cond);color:#1c3f8f;text-transform:uppercase;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.fxt .star{color:#c8102e;font-size:46px;margin:0 22px;transform:translateY(-4px)}
.lang-ja .fxt,.lang-zh .fxt{font-weight:900;font-size:68px}
.fxband{position:absolute;left:0;right:0;top:140px;height:34px;background:linear-gradient(180deg,#0b0c10,#202229)}
.fxcards{position:absolute;left:80px;width:1760px;top:206px;height:610px;display:flex;justify-content:center;gap:40px}
.fxc{flex:none;position:relative;background:linear-gradient(180deg,#eef0f4,#c9ced8);padding:7px;box-shadow:0 14px 30px rgba(0,0,0,.45);transition:opacity 300ms linear,transform 300ms var(--e-out)}
.fxc .ph{position:relative;height:506px;overflow:hidden;background:linear-gradient(160deg,var(--p5) 0%,var(--p7) 45%,var(--p9) 100%)}
.fxc .ph::before{content:"";position:absolute;inset:0;opacity:.13;background:
  radial-gradient(circle at 20% 30%,#fff 0 2px,transparent 3px) 0 0/64px 64px,
  repeating-linear-gradient(-35deg,rgba(255,255,255,.35) 0 2px,transparent 2px 38px)}
.fxc .ph .mg{position:absolute;left:50%;top:40px;width:250px;height:250px;margin-left:-125px;border-radius:50%;border:5px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;
  font:600 118px/1 var(--f-cond);letter-spacing:.02em;background:rgba(0,0,0,.14)}
.fxc .ph .pty{position:absolute;left:0;right:0;top:318px;text-align:center;font:600 34px/1 var(--f-cond);letter-spacing:.06em;text-transform:uppercase}
.fxc .ph .pty .itag{display:inline-block;margin-left:12px;background:#fff;color:#111;font-size:24px;padding:4px 10px;vertical-align:4px}
.fxc .ph .role{position:absolute;left:34px;right:34px;top:372px;text-align:center;font:500 30px/1.25 var(--f-sans);color:#f2f3f7}
.fxinfo{position:absolute;left:0;top:0;width:1760px;height:520px;display:flex;opacity:0;transform:translateY(14px);transition:opacity 260ms linear,transform 320ms var(--e-out);pointer-events:none;z-index:3;
  background:linear-gradient(180deg,#0b0e26,#10143a);box-shadow:0 18px 40px rgba(0,0,0,.55);border:2px solid #2a3060}
.fxinfo.focus{opacity:1;transform:none}
.fxinfo .rail{width:16px;flex:none;background:var(--p7)}
.fxinfo .ib{flex:1;min-width:0;padding:22px 34px 18px 30px;display:flex;flex-direction:column}
.fxinfo .ih{display:flex;align-items:center;gap:22px;padding-bottom:14px;border-bottom:2px solid rgba(255,255,255,.16)}
.fxinfo .ih .mono{width:84px;height:84px;font-size:38px}
.fxinfo .ih .mono .pl{width:24px;height:24px;font-size:16px}
.fxinfo .in{font:800 50px/1.05 var(--f-sans);white-space:nowrap;display:flex;align-items:center;gap:14px}
.fxinfo .in .itag{font:600 22px/1 var(--f-cond);background:#fff;color:#111;padding:5px 10px;text-transform:uppercase}
.fxinfo .ir{font:500 26px/1.25 var(--f-sans);color:#d5d9e4;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fxinfo .icols{flex:1;min-height:0;display:flex;gap:40px;margin-top:16px}
.fxinfo .icol{min-height:0;overflow:hidden}
.fxinfo .icol.a{width:600px;flex:none}
.fxinfo .icol.b{flex:1;min-width:0}
.fxinfo h4{font:600 24px/1 var(--f-num);letter-spacing:.08em;text-transform:uppercase;color:var(--yellow);margin:0 0 12px}
.fxinfo ul{list-style:none}
.fxinfo li{position:relative;padding-left:24px;margin-bottom:10px;font:500 26px/1.3 var(--f-sans);color:#fff}

#strip .sh .m .mc{font:700 11px/1 var(--f-num);letter-spacing:.05em;text-transform:uppercase;color:#444;margin-top:3px;white-space:nowrap}
#strip .sh .stat{margin-left:auto;font:700 20px/1 var(--f-num);letter-spacing:.04em;text-transform:uppercase;color:#333;white-space:nowrap}
#strip .rw{height:46px;display:flex;background:var(--plate);color:var(--ink)}
#strip .rw .ch{width:46px;flex:none;background:var(--p7);color:#fff;display:flex;align-items:center;justify-content:center;font:800 30px var(--f-num)}
#strip .rw .n{flex:1;min-width:0;display:flex;align-items:center;padding:0 12px;font:700 42px/1 var(--f-num);text-transform:uppercase;white-space:nowrap;overflow:hidden}
.lang-ja #strip .rw .n,.lang-zh #strip .rw .n{font-weight:700;font-size:36px}
#strip .rw .v{flex:none;display:flex;align-items:center;padding:0 12px;font:700 40px/1 var(--f-num);font-variant-numeric:tabular-nums}
#strip .rw .p{width:142px;flex:none;background:var(--p7);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;font:800 42px/1 var(--f-num);font-variant-numeric:tabular-nums}
#strip .rw .p.none{background:#9a9ea8}
#strip .cell{transition:opacity 130ms linear}
#strip.out .cell{opacity:0}
#strip .cell.c1{transition-delay:200ms} #strip .cell.c2{transition-delay:400ms}
#strip.in .cell{transition-duration:100ms}
#bal{width:270px;flex:none;margin-left:6px;display:flex;flex-direction:column;gap:4px;background:var(--ink-2)}
#bal .bh{height:46px;background:var(--plate);color:var(--ink);display:flex;align-items:center;padding:0 8px 0 10px;overflow:hidden}
#bal .bh .t{font:600 34px/1 var(--f-cond);text-transform:uppercase;white-space:nowrap}
.lang-ja #bal .bh .t,.lang-zh #bal .bh .t{font-weight:900;font-size:28px}
#bal .bh .m{margin-left:auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end}
#bal .bh .m small{font:700 10px/1 var(--f-num);letter-spacing:.05em;text-transform:uppercase;color:#444;white-space:nowrap}
#bal .bh .m b{font:800 24px/1 var(--f-num)}
#bal .tl{flex:1;display:flex;gap:3px}
#bal .tile{display:flex;flex-direction:column;background:var(--p7);min-width:0}
#bal .tile .n{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
#bal .tile .n b{font:800 54px/.95 var(--f-num);font-variant-numeric:tabular-nums}
#bal .tile .n span{font:700 13px/1 var(--f-num);letter-spacing:.04em;text-transform:uppercase;margin-top:2px;white-space:nowrap}
#bal .tile .sub{height:20px;background:var(--p9);font:700 12px/20px var(--f-num);letter-spacing:.03em;text-align:center;text-transform:uppercase;white-space:nowrap;overflow:hidden}
#bal .tile.d,#bal .tile.r{flex:1}
#bal .tile.i{width:46px;flex:none}
#bal .tile.i .n b{font-size:34px}
#bug{width:196px;flex:none;margin-left:6px;display:flex;flex-direction:column}
#bug .lv{height:34px;background:var(--live);display:flex;align-items:center;justify-content:center;font:800 25px/1 var(--f-sans);letter-spacing:.08em}
.lang-ja #bug .lv,.lang-zh #bug .lv{font-weight:900;font-size:22px}
#bug .br{flex:1;background:#fff;color:var(--navy-900);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;text-align:center}
#bug .br .a{font:700 29px/1 var(--f-cond);text-transform:uppercase;white-space:nowrap}
#bug .br .b{font:700 29px/1.05 var(--f-cond);color:var(--tab);white-space:nowrap}
.lang-ja #bug .br .a,.lang-zh #bug .br .a{font-weight:900;font-size:27px}
#bug .ck{height:40px;background:#414549;position:relative}
#bug .ck span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 24px/1 var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap;transition:opacity 300ms linear}
#bug .ck span.hide{opacity:0}

/* crawl (ja/zh) + disclosure: full-bleed, always on screen */
#crawl{position:absolute;left:0;top:1000px;width:1920px;height:46px;background:var(--navy-950);z-index:20;overflow:hidden;border-top:2px solid #2c3260}
#crawl .lab{position:absolute;left:0;top:0;bottom:0;z-index:2;background:var(--gold);color:#111;display:flex;align-items:center;padding:0 22px 0 80px;font:900 26px/1 var(--f-sans)}
#crawl .tr{position:absolute;left:0;top:0;height:44px;display:flex;align-items:center;white-space:nowrap;font:700 30px/1 var(--f-sans);will-change:transform}
#crawl .tr .sep{color:var(--gold);margin:0 .9em;font-size:.7em}
#disc{position:absolute;left:0;width:1920px;z-index:20;display:flex;align-items:center;justify-content:center;gap:14px;padding:0 80px;background:rgba(9,11,26,.92);white-space:nowrap}
#disc .ai{flex:none;border:2px solid var(--gold);color:var(--gold);font:800 16px/1 var(--f-num);padding:3px 7px;letter-spacing:.06em}
#disc .tx{font:500 20px/1 var(--f-sans);color:#e8eaf1;overflow:hidden;text-overflow:clip}
.lang-es #disc{top:1030px;height:44px}
.lang-ja #disc,.lang-zh #disc{top:1046px;height:34px}
.lang-ja #disc .tx,.lang-zh #disc .tx{font-size:18px}

#testBadge{position:absolute;right:0;top:0;z-index:40;background:var(--yellow);color:#000;font:800 22px/1 var(--f-num);letter-spacing:.08em;padding:8px 18px 8px 16px;text-transform:uppercase;border-bottom-left-radius:2px}
#spk{position:absolute;right:80px;top:6px;z-index:21;font:700 15px/1 var(--f-num);letter-spacing:.08em;text-transform:uppercase;color:#b9c0d2;opacity:0;transition:opacity 300ms linear}

/* ---------- scene stinger (T8 generic diagonal wipe; covers the scene area only, never the bar or disclosure) ---------- */
#sting{position:absolute;left:0;top:0;width:1920px;height:840px;overflow:hidden;z-index:15;pointer-events:none;visibility:hidden}
#sting.go{visibility:visible}
#sting .sp{position:absolute;top:-200px;left:-3000px;width:2900px;height:1240px;transform:skewX(-25deg);will-change:transform}
#sting .s1{background:var(--rep-700)} #sting .s2{background:#f4f5f8} #sting .s3{background:var(--dem-700)}
#sting .s4{background:linear-gradient(180deg,#1b1f52,#0d1030)}
#sting .lock{position:absolute;left:0;top:0;width:1920px;height:840px;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;z-index:2;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.45)}
#sting .lock .b1{font:700 44px/1 var(--f-cond);letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
#sting .lock .b2{font:700 120px/1.05 var(--f-cond);text-transform:uppercase;margin-top:14px;white-space:nowrap}
.lang-ja #sting .lock .b2,.lang-zh #sting .lock .b2{font-weight:900;font-size:108px}
#sting .lock .rule{width:0;height:6px;background:var(--tab);margin-top:18px}

#start{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6)}
#start button{font:800 40px var(--f-sans);padding:24px 48px;background:var(--tab);color:#fff;border:0;cursor:pointer}
#fontwarm{position:absolute;left:0;top:0;width:8px;height:8px;overflow:hidden;opacity:.01;white-space:nowrap;pointer-events:none;z-index:-1}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="scene"></div>
  <div id="sting"><div class="sp s1"></div><div class="sp s2"></div><div class="sp s3"></div><div class="sp s4"></div>
    <div class="lock"><div class="b1" id="stB1"></div><div class="b2" id="stB2"></div><div class="rule"></div></div></div>
  <div id="spk"></div>
  <div id="bar">
    <div id="pc"><div class="l" id="pcL1"></div><div class="l" id="pcL2"></div></div>
    <div id="cd"></div>
    <div id="strip"></div>
    <div id="bal"></div>
    <div id="bug"><div class="lv" id="bugLive"></div><div class="br"><div class="a" id="bugA"></div><div class="b" id="bugB"></div></div>
      <div class="ck"><span id="ck1"></span><span id="ck2" class="hide"></span></div></div>
  </div>
  <div id="crawl" hidden><div class="lab" id="crawlLab"></div><div class="tr" id="crawlTr"></div></div>
  <div id="disc"><span class="ai">AI</span><span class="tx" id="discTx"></span></div>
  <div id="testBadge" hidden></div>
  <div id="fontwarm"></div>
  <div id="start" hidden><button id="startBtn">▶</button></div>
  <audio id="audio" preload="auto"></audio>
</div>
<script src="election/vendor/d3.v7.min.js"></script>
<script src="election/desk.js"></script>
</body>
</html>
